codeBlocksErrors:
  BLOCK_STALE: ページが変更されました。再スキャンしてください。
  BLOCK_TOO_LARGE: 256 KiB またはDOMの複雑さの上限を超えています。切り詰めていません。
  EMPTY_BLOCK: このコードブロックは空です。
  INVALID_MESSAGE: リクエストを確認できません。再スキャンしてください。
  NO_CODE_BLOCKS: コードが見つかりません。ワークスペースに貼り付けることもできます。
  PAGE_UNAVAILABLE: このページにアクセスできません。再読み込みや権限を確認してください。
  PRIVATE_WINDOW_UNSUPPORTED: プライベートウィンドウでの抽出には未対応です。
  QUEUE_FULL: キューがいっぱいです。保留中の項目を処理して再試行してください。
  REQUEST_EXPIRED: リクエストの期限が切れました。ページから再抽出してください。
  STORAGE_UNAVAILABLE: セッション転送または設定の保存を利用できません。再試行するか対応状況を確認してください。
  STRUCTURE_UNCERTAIN: この構造は正確に抽出できません。手動でコピーしてください。
  WORKSPACE_OPEN_FAILED: 保存しましたがワークスペースを開けませんでした。再試行してください。
