codeBlocksErrors:
  BLOCK_STALE: 페이지가 변경되었습니다. 다시 검색하세요.
  BLOCK_TOO_LARGE: 256 KiB 또는 DOM 복잡도 제한을 초과했습니다. 내용은 잘리지 않았습니다.
  EMPTY_BLOCK: 이 코드 블록은 비어 있습니다.
  INVALID_MESSAGE: 요청을 확인할 수 없습니다. 다시 검색하세요.
  NO_CODE_BLOCKS: 코드 블록을 찾을 수 없습니다. 작업 공간에 코드를 붙여넣을 수 있습니다.
  PAGE_UNAVAILABLE: 이 페이지에 접근할 수 없습니다. 새로고침하거나 권한을 확인하세요.
  PRIVATE_WINDOW_UNSUPPORTED: 비공개 창에서는 코드 추출을 지원하지 않습니다.
  QUEUE_FULL: 대기열이 가득 찼습니다. 대기 항목을 처리한 후 다시 시도하세요.
  REQUEST_EXPIRED: 요청이 만료되었습니다. 페이지에서 다시 추출하세요.
  STORAGE_UNAVAILABLE: 세션 전송 또는 설정 저장을 사용할 수 없습니다. 다시 시도하거나 브라우저 지원을 확인하세요.
  STRUCTURE_UNCERTAIN: 이 구조는 정확하게 추출할 수 없습니다. 수동으로 복사하세요.
  WORKSPACE_OPEN_FAILED: 저장했지만 작업 공간을 열 수 없습니다. 다시 시도하세요.
